<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>云梅Air - 离线开锁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .lock-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lock-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lock-info {
            flex: 1;
        }

        .lock-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .lock-mac {
            font-size: 12px;
            opacity: 0.8;
        }

        .btn {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.9;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            opacity: 0.8;
        }

        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            width: 0%;
            transition: width 0.3s;
        }

        .alert {
            background: rgba(255, 200, 0, 0.2);
            border: 1px solid rgba(255, 200, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        .alert-title {
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>云梅Air</h1>
        <div class="subtitle">离线开锁模式</div>
    </div>

    <div class="container">
        <div class="card alert">
            <div class="alert-title">离线独立模式</div>
            <div>
                您正在使用离线独立页面。此页面可以保存到主屏幕，即使没有网络也能打开。
                但首次使用前，您需要至少联网登录一次。
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 16px; font-size: 18px;">我的门锁</h2>
            <div id="lockList" class="lock-list">
            </div>
        </div>

        <div id="status" class="status" style="display: none;">
            准备就绪
        </div>

        <div id="progressContainer" style="display: none;">
            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="card" style="font-size: 13px; line-height: 1.6;">
            <strong>使用提示：</strong>
            <ul style="margin-left: 20px; margin-top: 8px;">
                <li>点击"开锁"按钮后，选择对应的蓝牙设备</li>
                <li>确保蓝牙已开启且门锁在附近</li>
                <li>此页面完全离线运行，无需网络</li>
                <li>将此页面添加到主屏幕以便快速访问</li>
            </ul>
        </div>
    </div>

    <div class="footer">
        云梅Air 离线版本 | 完全本地运行
    </div>

    <script>
        const DB_NAME = 'yunmei-db';
        const STORE_NAME = 'yunmei-store';

        let locks = [];
        let isUnlocking = false;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadLocks();
            renderLocks();
        });

        async function loadLocks() {
            try {
                const db = await openDatabase();
                const data = await getData(db, 'yunmei-storage');
                
                if (data && data.state && data.state.locks) {
                    locks = data.state.locks;
                    console.log('[Offline] 已加载', locks.length, '个门锁');
                } else {
                    console.warn('[Offline] 未找到门锁数据');
                }
            } catch (error) {
                console.error('[Offline] 加载数据失败:', error);
                showStatus('加载数据失败: ' + error.message, true);
            }
        }

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function getData(db, key) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(key);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function renderLocks() {
            const container = document.getElementById('lockList');
            
            if (!locks || locks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔒</div>
                        <div>暂无门锁数据</div>
                        <div style="margin-top: 8px; font-size: 12px; opacity: 0.8;">
                            请先在主应用中登录并同步门锁
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = locks.map(lock => `
                <div class="lock-item">
                    <div class="lock-info">
                        <div class="lock-name">${escapeHtml(lock.label || '未命名门锁')}</div>
                        <div class="lock-mac">${escapeHtml(lock.mac || '')}</div>
                    </div>
                    <button class="btn" onclick="unlockLock('${lock.id}')">开锁</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function unlockLock(lockId) {
            if (isUnlocking) {
                showStatus('请等待当前操作完成', true);
                return;
            }

            if (!navigator.bluetooth) {
                showStatus('此浏览器不支持蓝牙功能', true);
                return;
            }

            const lock = locks.find(l => l.id === lockId);
            if (!lock) {
                showStatus('门锁信息不存在', true);
                return;
            }

            isUnlocking = true;
            showStatus('准备开锁...', false);
            showProgress(0);

            try {
                updateProgress(10, '请求蓝牙设备...');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [lock.serviceUuid.toLowerCase()] }]
                });

                updateProgress(30, '连接中...');
                const server = await device.gatt.connect();

                updateProgress(50, '获取蓝牙服务...');
                const service = await server.getPrimaryService(lock.serviceUuid.toLowerCase());

                updateProgress(60, '获取蓝牙特征...');
                const characteristic = await service.getCharacteristic(lock.characteristicUuid.toLowerCase());

                updateProgress(80, '生成开锁指令...');
                const password = generatePassword(lock.secret);

                updateProgress(90, '发送开锁指令...');
                await characteristic.writeValue(password);

                updateProgress(100, '开锁成功！');
                
                setTimeout(() => {
                    hideProgress();
                }, 2000);

            } catch (error) {
                console.error('[Offline] 开锁失败:', error);
                showStatus('开锁失败: ' + error.message, true);
                hideProgress();
            } finally {
                isUnlocking = false;
            }
        }

        function generatePassword(secret) {
            const buffer = new ArrayBuffer(1024);
            const view = new DataView(buffer);
            let offset = 0;

            let randomNum = Math.floor(Math.random() * 1000000);

            view.setUint8(offset++, 0xD0);

            const dataLength = secret.length + 2 + 2 + 10;
            view.setUint8(offset++, dataLength);

            for (let i = 0; i < secret.length; i++) {
                view.setUint8(offset++, secret.charCodeAt(i));
            }

            view.setUint8(offset++, 0xA5);

            for (let i = 0; i < 6; i++) {
                view.setUint8(offset++, randomNum % 10);
                randomNum = Math.floor(randomNum / 10);
            }

            view.setUint8(offset++, 73);  // 'I'
            view.setUint8(offset++, 68);  // 'D'
            view.setUint8(offset++, 48);  // '0'
            view.setUint8(offset++, 49);  // '1'

            view.setUint8(offset++, 0xA7);

            return new DataView(buffer, 0, offset);
        }

        function showStatus(message, isError) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            statusEl.style.background = isError 
                ? 'rgba(255, 100, 100, 0.3)' 
                : 'rgba(100, 255, 100, 0.3)';
            
            if (!isError) {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }

        function showProgress(progress) {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function updateProgress(progress, message) {
            showProgress(progress);
            showStatus(message, false);
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        }
    </script>
</body>
</html>
